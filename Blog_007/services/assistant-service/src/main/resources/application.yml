spring:
  application:
    name: assistant-service
  config:
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"
  profiles:
    default: api                      # roles: api (chat endpoint), embedder (Kafka → vectors); combine with "api,embedder"
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/assistant_db
    username: ${ASSISTANT_DB_USER:assistant}
    password: ${ASSISTANT_DB_PASSWORD:}
    hikari:
      pool-name: assistant-pool
      maximum-pool-size: 10
      connection-timeout: 3000
      data-source-properties:
        connectTimeout: 3
        socketTimeout: 10
        options: "-c statement_timeout=5000"
  flyway:
    locations: classpath:db/migration
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 250ms
      connect-timeout: 250ms
  ai:
    ollama:
      base-url: ${OLLAMA_BASE_URL:http://localhost:11434}
      chat:
        options:
          model: ${PULSE_CHAT_MODEL:qwen3:4b-instruct}
      embedding:
        options:
          model: ${PULSE_EMBEDDING_MODEL:nomic-embed-text}
      init:
        pull-model-strategy: never    # pull models yourself (ollama pull …): no surprise multi-GB downloads at startup
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest     # a brand-new consumer group starts from the beginning of the topic
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 300000
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
  mvc:
    problemdetails:
      enabled: true

server:
  port: 8083
  shutdown: graceful
  error:
    include-stacktrace: never

management:
  server:
    port: 9083
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

pulse:
  assistant:
    content-service-url: ${CONTENT_SERVICE_URL:http://localhost:8081}
    chat-model: ${PULSE_CHAT_MODEL:qwen3:4b-instruct}
    max-tool-calls: 4                 # PLAN §13.6
    max-output-tokens: 512
    timeout: 20s                      # overall budget per answer
    memory-turns: 10                  # last 10 messages (5 exchanges) sent back to the model
    memory-ttl: 24h
    answer-cache-ttl: 10m
    # Since Phase 5 the api-gateway owns CORS. Empty = no CORS checks here (the gateway already decided).
    # Set it only when browsers call this service DIRECTLY, e.g. PULSE_ASSISTANT_CORS_ORIGINS=http://localhost:3000
    cors-origins: ${PULSE_ASSISTANT_CORS_ORIGINS:}
    context-window: 8192              # Ollama num_ctx: system prompt + retrieved sources + history must fit
    embed-timeout: 4s                 # slow embedding model → keyword-only search instead of waiting
    pre-retrieval: true               # RAG-first: search before the model answers (small models forget tools)
  embedder:
    kafka-enabled: ${PULSE_EMBEDDER_KAFKA_ENABLED:true}
    reconcile-on-startup: ${PULSE_EMBEDDER_RECONCILE_ON_STARTUP:true}
    reconcile-interval: ${PULSE_EMBEDDER_RECONCILE_INTERVAL:30m}   # catches deletions that have no event (removed feed items)

springdoc:
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    com.pulse: INFO
