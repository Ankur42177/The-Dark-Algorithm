{{- /*
One ConfigMap per enabled service, holding its NON-secret environment variables (Twelve-Factor III).
Pods read them with envFrom. Changing a value changes the checksum annotation on the Deployment,
which triggers a rolling restart (see deployment.yaml).
*/}}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-config
  labels:
    {{- include "pulse.labels" (dict "name" $name "root" $) | nindent 4 }}
data:
  {{- range $key, $value := $svc.env }}
  {{ $key }}: {{ tpl (toString $value) $ | quote }}
  {{- end }}
{{- end }}
{{- end }}
