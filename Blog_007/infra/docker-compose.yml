# =====================================================================
# Local infrastructure for Pulse. Explained line by line in
# Learning_project/phase-00-foundations/03-docker-and-compose.md
#
# PROFILES let us start only what the current phase needs:
#   core -> Postgres (+pgvector) and Redis          (Phase 0+)
#   msg  -> Kafka (KRaft) + Kafka UI, RabbitMQ       (Phase 6/7)
#   ai   -> Ollama                                    (added in Phase 8)
#   obs  -> Prometheus, Grafana, Jaeger, OTel         (added in Phase 9)
#   apps -> all Spring services + web as containers   (added later)
#
# Run from the Blog_007 folder:
#   docker compose -f infra/docker-compose.yml --env-file .env --profile core up -d
# =====================================================================
name: pulse

services:

  postgres:
    # Official Postgres 18 with the pgvector extension pre-installed (needed in Phase 8).
    # We pin an EXACT tag so everybody gets the same database version.
    image: pgvector/pgvector:0.8.7-pg18
    profiles: ["core"]
    container_name: pulse-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_SUPERUSER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?set POSTGRES_SUPERUSER_PASSWORD in .env}
      # Passed through to the init script, which creates one database + user per service.
      CONTENT_DB_PASSWORD: ${CONTENT_DB_PASSWORD:?set CONTENT_DB_PASSWORD in .env}
      INGESTION_DB_PASSWORD: ${INGESTION_DB_PASSWORD:?set INGESTION_DB_PASSWORD in .env}
      ASSISTANT_DB_PASSWORD: ${ASSISTANT_DB_PASSWORD:?set ASSISTANT_DB_PASSWORD in .env}
    ports:
      - "5432:5432"            # host:container -> reach it at localhost:5432 from your Mac
    volumes:
      - pg-data:/var/lib/postgresql   # named volume: data survives `docker compose down`
      - ./postgres/init:/docker-entrypoint-initdb.d:ro   # scripts run ONCE, on an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.8.4-alpine
    profiles: ["core"]
    container_name: pulse-redis
    # --appendonly yes : write every change to a log on disk (AOF) so a restart keeps data
    # --maxmemory      : never use more than 256 MB of RAM
    # allkeys-lfu      : when full, evict the Least Frequently Used keys (good for a cache)
    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lfu
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # ------------------------------------------------------------------ msg profile (Phase 6/7)

  kafka:
    # Apache Kafka in KRaft mode: the broker also runs the controller quorum (no ZooKeeper since Kafka 4).
    image: apache/kafka:4.4.0
    profiles: ["msg"]
    container_name: pulse-kafka
    ports:
      - "9092:9092"                       # clients on your Mac use localhost:9092
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Three listeners: PLAINTEXT for the Mac, INTERNAL for other containers, CONTROLLER for KRaft voting.
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: pulse-local-kraft-cluster-01
      # Single broker => replication factor 1 everywhere (Kubernetes uses 3, see PLAN §9.1).
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"   # topics are created explicitly by the services (KafkaTopicConfig)
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.1
    profiles: ["msg"]
    container_name: pulse-kafka-ui
    ports:
      - "8085:8080"                       # http://localhost:8085 — browse topics, messages, consumer lag
    environment:
      KAFKA_CLUSTERS_0_NAME: pulse
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      JAVA_OPTS: "-Xmx256m"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  rabbitmq:
    # The management image includes the web UI at http://localhost:15672
    image: rabbitmq:4.3.8-management
    profiles: ["msg"]
    container_name: pulse-rabbitmq
    ports:
      - "5672:5672"                       # AMQP protocol (the services)
      - "15672:15672"                     # management UI (you)
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-pulse}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?set RABBITMQ_PASSWORD in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 12
    restart: unless-stopped

volumes:
  pg-data:
  redis-data:
  kafka-data:
  rabbitmq-data:
