{{- /*
OPTIONAL single-broker Kafka (KRaft mode, no ZooKeeper) for local experiments with Phases 6-8.
Production / multi-broker: use the Strimzi operator (https://strimzi.io) — `Kafka` and `KafkaTopic`
custom resources, 3 brokers, replication factor 3, min.insync.replicas 2 (PLAN §9.1).
*/}}
{{- with .Values.infra.kafka }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: pulse-kafka
  labels:
    {{- include "pulse.commonLabels" $ | nindent 4 }}
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: pulse-kafka
  ports:
    - name: kafka
      port: 9092
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulse-kafka
  labels:
    {{- include "pulse.commonLabels" $ | nindent 4 }}
spec:
  serviceName: pulse-kafka
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-kafka
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-kafka
        app.kubernetes.io/component: infrastructure
        app.kubernetes.io/part-of: pulse
    spec:
      containers:
        - name: kafka
          image: {{ .image | quote }}
          env:
            - { name: KAFKA_NODE_ID, value: "1" }
            - { name: KAFKA_PROCESS_ROLES, value: "broker,controller" }
            - { name: KAFKA_LISTENERS, value: "PLAINTEXT://:9092,CONTROLLER://:9093" }
            - { name: KAFKA_ADVERTISED_LISTENERS, value: "PLAINTEXT://pulse-kafka-0.pulse-kafka.{{ $.Release.Namespace }}.svc.cluster.local:9092" }
            - { name: KAFKA_CONTROLLER_LISTENER_NAMES, value: "CONTROLLER" }
            - { name: KAFKA_LISTENER_SECURITY_PROTOCOL_MAP, value: "CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT" }
            - { name: KAFKA_CONTROLLER_QUORUM_VOTERS, value: "1@localhost:9093" }
            - { name: KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR, value: "1" }
            - { name: KAFKA_NUM_PARTITIONS, value: {{ .partitions | quote }} }
          ports:
            - name: kafka
              containerPort: 9092
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/kafka/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: {{ .storage }}
{{- end }}
{{- end }}
