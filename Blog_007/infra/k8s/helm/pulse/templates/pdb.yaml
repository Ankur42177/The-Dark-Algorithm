{{- /*
PodDisruptionBudget: limits VOLUNTARY disruptions (node drains, cluster upgrades) — e.g. "at most one
content-service pod may be evicted at a time". It does not protect against crashes.
*/}}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.pdb }}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  labels:
    {{- include "pulse.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  {{- toYaml $svc.pdb | nindent 2 }}
  selector:
    matchLabels:
      {{- include "pulse.selectorLabels" (dict "name" $name "root" $) | nindent 6 }}
{{- end }}
{{- end }}
