{{- /*
Secrets: by DEFAULT this chart does NOT create the Secret (secrets.create: false). It expects an
existing Secret named .Values.secrets.name, created outside Helm (scripts/k8s-up.sh does it from .env).
Why? Helm stores every rendered manifest — including Secret data — in its release history inside the
cluster. Keeping secrets out of values/Helm means they never land in values files, CI logs or history.
For throwaway clusters you may set secrets.create=true and pass values with --set-file.
*/}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "pulse.commonLabels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.secrets.values }}
  {{ $key }}: {{ required (printf "secrets.values.%s must not be empty" $key) $value | quote }}
  {{- end }}
{{- end }}
