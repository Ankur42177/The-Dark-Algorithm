{{- /*
HorizontalPodAutoscaler (autoscaling/v2) for services that scale on CPU:
   desiredReplicas = ceil( currentReplicas × currentCPU% / targetCPU% )
CPU% is measured against the container's CPU REQUEST — no request, no HPA.
A Deployment must be owned by ONE autoscaler: KEDA creates its own HPA, so enabling both is an error.
*/}}
{{- range $name, $svc := .Values.services }}
{{- $auto := $svc.autoscaling | default dict }}
{{- $hpa := $auto.hpa | default dict }}
{{- if and $svc.enabled $hpa.enabled }}
{{- if ($auto.keda | default dict).enabled }}
{{- fail (printf "services.%s: enable autoscaling.hpa OR autoscaling.keda, not both (KEDA creates its own HPA)" $name) }}
{{- end }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}
  labels:
    {{- include "pulse.labels" (dict "name" $name "root" $) | nindent 4 }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}
  minReplicas: {{ $hpa.minReplicas | default 2 }}
  maxReplicas: {{ $hpa.maxReplicas | default 10 }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage | default 60 }}
  {{- with $hpa.behavior }}
  behavior:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
