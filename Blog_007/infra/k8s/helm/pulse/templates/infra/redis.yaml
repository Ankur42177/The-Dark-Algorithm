{{- /* Redis as a single-pod StatefulSet with an append-only file on a PVC (same flags as Docker Compose). */}}
{{- with .Values.infra.redis }}
{{- if .enabled }}
apiVersion: v1
kind: Service
metadata:
  name: pulse-redis
  labels:
    {{- include "pulse.commonLabels" $ | nindent 4 }}
spec:
  selector:
    app.kubernetes.io/name: pulse-redis
  ports:
    - name: redis
      port: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: pulse-redis
  labels:
    {{- include "pulse.commonLabels" $ | nindent 4 }}
spec:
  serviceName: pulse-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: pulse-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: pulse-redis
        app.kubernetes.io/component: infrastructure
        app.kubernetes.io/part-of: pulse
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 999                 # the "redis" user inside the official image
        fsGroup: 999
      containers:
        - name: redis
          image: {{ .image | quote }}
          args: ["redis-server", "--appendonly", "yes", "--maxmemory", {{ .maxmemory | quote }}, "--maxmemory-policy", "allkeys-lfu"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            periodSeconds: 5
          resources:
            {{- toYaml .resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- with .storageClassName }}
        storageClassName: {{ . }}
        {{- end }}
        resources:
          requests:
            storage: {{ .storage }}
{{- end }}
{{- end }}
