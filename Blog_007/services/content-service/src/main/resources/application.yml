# =====================================================================
# content-service configuration. Explained key by key in
# Learning_project/phase-01-content-service/06-configuration-explained.md
#
# ${NAME:default} = read environment variable NAME, or use "default".
# This is Twelve-Factor rule III: config lives in the environment,
# so the SAME jar runs on your laptop, in Docker and in Kubernetes.
# =====================================================================
spring:
  application:
    name: content-service

  config:
    # Load the git-ignored .env file if it exists (local development only).
    # Two paths: one for running from Blog_007/, one from the module folder.
    import: "optional:file:.env[.properties],optional:file:../../.env[.properties]"

  threads:
    virtual:
      enabled: true   # Java 21+ virtual threads: one cheap thread per request (see learning notes)

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/content_db
    username: ${CONTENT_DB_USER:content}
    password: ${CONTENT_DB_PASSWORD:}   # no default on purpose: comes from .env / env var
    hikari:
      pool-name: content-pool
      maximum-pool-size: 10          # max open DB connections (Postgres default limit is 100 total)
      minimum-idle: 2
      connection-timeout: 3000       # ms to wait for a free connection before failing fast
      max-lifetime: 1800000          # recycle connections every 30 min
      # Timeouts INSIDE the PostgreSQL driver. Without these, a frozen/partitioned database makes
      # requests hang forever (we measured > 25 s with `docker pause pulse-postgres`).
      data-source-properties:
        connectTimeout: 3            # seconds to open a TCP connection
        socketTimeout: 5             # seconds to wait for ANY response on an open connection
        options: "-c statement_timeout=3000"   # server-side: cancel any query running > 3 s

  jpa:
    open-in-view: false              # don't keep a DB connection open while JSON is being written
    hibernate:
      ddl-auto: validate             # Flyway owns the schema; Hibernate only checks it
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 250ms                 # a cache that answers slowly is worse than no cache
      connect-timeout: 250ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      acks: all                        # leader AND in-sync replicas must have the event before "OK"
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      properties:
        enable.idempotence: true       # broker drops duplicate retries from this producer (no dupes per partition)
        max.block.ms: 5000             # don't hang 60 s when Kafka is down
        delivery.timeout.ms: 10000
        request.timeout.ms: 5000
    consumer:
      auto-offset-reset: earliest      # a brand-new group starts from the oldest retained event
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.interval.ms: 60000
    listener:
      missing-topics-fatal: false

  # Email (newsletter + contact form). Spring Boot creates a JavaMailSender ONLY if host is set.
  # Unset (default) = emails are written to the log instead (LoggingMailer): zero infra for local dev.
  # Local SMTP with a web inbox: start Mailpit (docker compose --profile mail) and set SPRING_MAIL_HOST=localhost.
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:1025}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail.smtp.connectiontimeout: 3000   # ms: never hang a request on a dead mail server
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

  mvc:
    problemdetails:
      enabled: true                  # RFC 9457 JSON errors for Spring's built-in exceptions

server:
  port: 8081
  shutdown: graceful                 # on stop: finish in-flight requests first (matters in Kubernetes)
  # Behind the api-gateway every request comes FROM the gateway; the real client IP is in X-Forwarded-For.
  # "native" = Tomcat's RemoteIpValve: it replaces request.getRemoteAddr() with the X-Forwarded-For client,
  # but ONLY when the direct peer is a trusted proxy (regex below). From anywhere else the header is
  # ignored — otherwise anyone could spoof X-Forwarded-For to dodge the login throttle or frame someone.
  forward-headers-strategy: native
  tomcat:
    remoteip:
      # Loopback + private ranges (gateway in Docker/k8s). Narrow it in production via PULSE_TRUSTED_PROXIES.
      # No {n} quantifiers: braces would end the ${...} placeholder.
      internal-proxies: ${PULSE_TRUSTED_PROXIES:127\.\d+\.\d+\.\d+|0:0:0:0:0:0:0:1|::1|10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|172\.(1[6-9]|2[0-9]|3[01])\.\d+\.\d+}
  compression:
    enabled: true                    # gzip JSON responses larger than 2 KB
    min-response-size: 2KB
  error:
    include-stacktrace: never        # never leak stack traces to clients

management:
  server:
    port: 9081                       # actuator on a SEPARATE port: never exposed through the gateway
  endpoints:
    web:
      exposure:
        include: health,info,metrics   # metrics: /actuator/metrics/pulse.cache.requests
  endpoint:
    health:
      probes:
        enabled: true                # /actuator/health/liveness and /readiness for Kubernetes
  health:
    mail:
      enabled: false                 # an optional mail relay being down must not mark the whole service DOWN

pulse:
  outbox:
    poll-interval: 250ms
  kafka:
    partitions: 3                      # 6 in Kubernetes (PLAN §9.1)
    replicas: 1                        # 3 in Kubernetes
  web:
    base-url: ${WEB_URL:http://localhost:3000}        # links in emails point to the website
    revalidate-url: ${WEB_URL:http://localhost:3000}/api/revalidate
    revalidate-secret: ${REVALIDATE_SECRET:}
  auth:
    admin-username: ${ADMIN_USERNAME:ankur}
    admin-display-name: ${ADMIN_DISPLAY_NAME:Ankur Kumar}
    admin-password-hash: ${ADMIN_PASSWORD_HASH:}      # from scripts/hash-password.sh; empty = login disabled
    jwt-private-key: ${PULSE_JWT_PRIVATE_KEY:}        # from scripts/gen-jwt-keys.sh; empty = temporary key (dev)
    jwt-public-key: ${PULSE_JWT_PUBLIC_KEY:}
    issuer: ${PULSE_JWT_ISSUER:https://pulse.local}
    access-ttl: 15m
    refresh-ttl: 7d
    cookie-secure: ${PULSE_COOKIE_SECURE:true}
  scheduler:
    publish-interval: 30s
  views:
    flush-interval: 60s              # write-behind: Redis counters -> Postgres every minute
  trending:
    decay-cron: "0 0 * * * *"        # every hour, on the hour (sec min hour day month weekday)
  cors:
    allowed-origins: ${PULSE_CORS_ORIGINS:http://localhost:3000}
  mail:
    from: ${PULSE_MAIL_FROM:Pulse <newsletter@pulse.local>}
  newsletter:
    cron: ${PULSE_NEWSLETTER_CRON:0 0 9 1 * *}         # 09:00 UTC on the 1st of every month ("-" = disabled)
    token-secret: ${PULSE_NEWSLETTER_SECRET:}          # HMAC key for unsubscribe links; empty = temporary (dev)
    resend-cooldown: 10m                               # max one confirmation email per address per 10 min
  contact:
    notify: ${PULSE_CONTACT_NOTIFY:}                   # owner's address for new-message emails; empty = don't email
    ip-hash-secret: ${PULSE_IP_HASH_SECRET:}           # HMAC key for contact_messages.ip_hash; empty = per-process

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.pulse: DEBUG

---
# ---------------------------------------------------------------------
# "dev" profile: activate with SPRING_PROFILES_ACTIVE=dev (or -Dspring-boot.run.profiles=dev).
# Adds sample posts so the API has something to show.
# ---------------------------------------------------------------------
spring:
  config:
    activate:
      on-profile: dev
  flyway:
    locations: classpath:db/migration,classpath:db/seed
