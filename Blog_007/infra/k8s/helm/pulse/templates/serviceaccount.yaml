{{- /*
One ServiceAccount = the identity our pods run as inside the cluster. Our apps never call the Kubernetes
API, so the API token is NOT mounted (automountServiceAccountToken: false) — less to steal.
*/}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.serviceAccount.name }}
  labels:
    {{- include "pulse.commonLabels" . | nindent 4 }}
automountServiceAccountToken: false
{{- end }}
